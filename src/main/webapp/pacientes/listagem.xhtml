<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:pt="jakarta.faces.passthrough"
                template="/WEB-INF/templates/template.xhtml">

    <ui:define name="titulo">
        Prontus — Consulta de Paciente
    </ui:define>

    <ui:define name="metadata">
        <f:metadata>
            <f:viewParam name="nome"
                         value="#{pacienteConsultaBean.nome}"/>

            <f:viewParam name="dataNascimentoIni"
                         value="#{pacienteConsultaBean.dataNascimentoIni}"
                         converterMessage="Informe uma data de nascimento inicial válida.">
                <f:convertDateTime type="localDate"
                                   pattern="yyyy-MM-dd"/>
            </f:viewParam>

            <f:viewParam name="dataNascimentoFim"
                         value="#{pacienteConsultaBean.dataNascimentoFim}"
                         converterMessage="Informe uma data de nascimento final válida.">
                <f:convertDateTime type="localDate"
                                   pattern="yyyy-MM-dd"/>
            </f:viewParam>

            <f:viewParam name="primeiraPosicao"
                         value="#{pacienteConsultaBean.primeiraPosicao}"
                         converterMessage="A posição da página deve ser um número inteiro."
                         validatorMessage="A posição da página deve estar entre 0 e 2147483637.">
                <f:validateLongRange minimum="0"
                                     maximum="2147483637"/>
            </f:viewParam>

            <f:viewAction action="#{pacienteConsultaBean.carregar}"/>
        </f:metadata>
    </ui:define>

    <ui:define name="conteudo">
        <section class="listagem-pacientes" aria-labelledby="titulo-pacientes">
            <div class="pagina__cabecalho">
                <h1 id="titulo-pacientes">Consulta de Paciente</h1>

                <h:link outcome="/pacientes/cadastro"
                        value="Novo registro"
                        styleClass="botao"/>
            </div>

            <p class="pagina__descricao">
                Consulte pelo nome e pelo intervalo de nascimento.
            </p>

            <h:messages id="mensagens"
                        styleClass="mensagens"
                        showSummary="true"
                        showDetail="false"
                        errorClass="mensagens__erro"
                        infoClass="mensagens__sucesso"/>

            <form method="get"
                  action="#{request.contextPath}/pacientes/listagem.xhtml"
                  class="filtros">

                <div class="campo">
                    <label for="nome">Nome</label>
                    <input type="search"
                           id="nome"
                           name="nome"
                           value="#{param.nome}"
                           placeholder="Digite parte do nome"/>
                </div>

                <div class="campo">
                    <label for="dataNascimentoIni">
                        Data Nascimento Inicial
                    </label>
                    <input type="date"
                           id="dataNascimentoIni"
                           name="dataNascimentoIni"
                           min="1900-01-01"
                           max="#{pacienteConsultaBean.dataMaximaNascimento}"
                           value="#{param.dataNascimentoIni}"/>
                </div>

                <div class="campo">
                    <label for="dataNascimentoFim">
                        Data Nascimento Final
                    </label>
                    <input type="date"
                           id="dataNascimentoFim"
                           name="dataNascimentoFim"
                           min="1900-01-01"
                           max="#{pacienteConsultaBean.dataMaximaNascimento}"
                           value="#{param.dataNascimentoFim}"/>
                </div>

                <div class="filtros__acoes">
                    <button type="submit" class="botao">
                        Consultar
                    </button>

                    <h:link outcome="/pacientes/listagem"
                            includeViewParams="false"
                            value="Limpar"
                            styleClass="botao botao--secundario"/>
                </div>
            </form>

            <h:form id="tabelaForm">
                <h:panelGroup layout="block"
                              styleClass="resultado"
                              rendered="#{pacienteConsultaBean.modelo ne null}">

                    <p:dataTable id="pacientes"
                                 widgetVar="tabelaPacientes"
                                 value="#{pacienteConsultaBean.modelo}"
                                 var="paciente"
                                 rowKey="#{paciente.id}"
                                 lazy="true" reflow="true"
                                 paginator="true"
                                 paginatorPosition="bottom"
                                 paginatorAlwaysVisible="true"
                                 rows="10"
                                 first="#{pacienteConsultaBean.primeiraPosicao}"
                                 rowsPerPageTemplate="10,20,50"
                                 paginatorTemplate="{FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                 editable="true"
                                 editMode="row"
                                 emptyMessage="Nenhum registro encontrado."
                                 styleClass="tabela-pacientes">

                        <p:ajax event="rowEdit"
                                listener="#{pacienteConsultaBean.salvarEdicao}"
                                update=":dialogErroEdicao :dialogAtualizacaoSucesso"
                                oncomplete="if (args &amp;&amp; args.validationFailed) {
                                    restaurarTabelaErro();
                                } else if (args &amp;&amp; args.pacienteAtualizado) {
                                    PF('atualizacaoSucesso').show();
                                }"/>

                        <p:ajax event="rowEditCancel" oncomplete="restaurarTabela();"/>

                        <f:facet name="header">
                            <h:panelGroup layout="block"
                                          styleClass="resultado__cabecalho">
                                <h:outputText value="Total de registros: #{pacienteConsultaBean.totalRegistros}"/>
                                <h:outputLink value="#{request.contextPath}/relatorios/pacientes.pdf"
                                              rendered="#{pacienteConsultaBean.totalRegistros gt 0}"
                                              styleClass="botao botao--secundario" title="Baixar relatório em PDF">
                                    <f:param name="nome" value="#{pacienteConsultaBean.nome}"/>
                                    <f:param name="dataNascimentoIni" value="#{pacienteConsultaBean.dataNascimentoIni}"/>
                                    <f:param name="dataNascimentoFim" value="#{pacienteConsultaBean.dataNascimentoFim}"/>
                                    <span class="pi pi-file-pdf" aria-hidden="true"></span>
                                    Baixar PDF
                                </h:outputLink>
                            </h:panelGroup>
                        </f:facet>

                        <p:column headerText="Código">
                            <h:outputText value="#{paciente.id}"/>
                        </p:column>

                        <p:column headerText="Nome">
                            <p:cellEditor>
                                <f:facet name="output">
                                    <h:outputText value="#{paciente.nomeCompleto}" styleClass="nome-maiusculo"/>
                                </f:facet>

                                <f:facet name="input">
                                    <div class="campo">
                                        <h:inputText id="nomeEdicao"
                                                     value="#{paciente.nomeCompleto}"
                                                     required="true"
                                                     requiredMessage="O nome completo é obrigatório."
                                                     maxlength="255"
                                                     pt:aria-label="Nome completo">
                                            <f:validateBean/>
                                        </h:inputText>
                                    </div>
                                </f:facet>
                            </p:cellEditor>
                        </p:column>

                        <p:column headerText="Data de Nascimento">
                            <p:cellEditor>
                                <f:facet name="output">
                                    <h:outputText value="#{paciente.dataNascimento}">
                                        <f:convertDateTime type="localDate"
                                                           pattern="dd/MM/yyyy"/>
                                    </h:outputText>
                                </f:facet>

                                <f:facet name="input">
                                    <div class="campo">
                                        <h:inputText id="nascimentoEdicao"
                                                     value="#{paciente.dataNascimento}"
                                                     required="true"
                                                     requiredMessage="A data de nascimento é obrigatória."
                                                     converterMessage="Informe uma data de nascimento válida."
                                                     pt:type="date"
                                                     pt:min="1900-01-01"
                                                     pt:max="#{pacienteConsultaBean.dataMaximaNascimento}"
                                                     pt:aria-label="Data de nascimento">
                                            <f:convertDateTime type="localDate"
                                                               pattern="yyyy-MM-dd"/>
                                            <f:validateBean/>
                                        </h:inputText>
                                    </div>
                                </f:facet>
                            </p:cellEditor>
                        </p:column>

                        <p:column headerText="Ações" styleClass="tabela__acoes">

                                <p:rowEditor editTitle="Editar registro"
                                             saveTitle="Salvar alteração"
                                             cancelTitle="Cancelar edição"/>

                                <p:commandButton id="calcularIdade"
                                                 icon="pi pi-calculator"
                                                 title="Calcular idade"
                                                 ariaLabel="Calcular idade"
                                                 action="#{pacienteConsultaBean.calcularIdade(paciente.id)}"
                                                 process="@this"
                                                 update=":dialogIdade"
                                                 oncomplete="if (args &amp;&amp; args.idadeCalculada) {
                                                                PF('dialogIdade').show();
                                                             }"
                                />
                        </p:column>

                    </p:dataTable>
                </h:panelGroup>
            </h:form>
            <h:form id="restauracaoForm">
                <p:remoteCommand name="restaurarTabelaErro"
                                 action="#{pacienteConsultaBean.cancelarEdicao}"
                                 process="@this" update=":tabelaForm :mensagens :dialogErroEdicao"
                                 resetValues="true" oncomplete="PF('erroEdicao').show();"/>
                <p:remoteCommand name="restaurarTabela"
                                 action="#{pacienteConsultaBean.cancelarEdicao}"
                                 process="@this"
                                 update=":tabelaForm :mensagens"
                                 resetValues="true"/>
            </h:form>
            <p:dialog id="dialogErroEdicao" widgetVar="erroEdicao"
                      header="Não foi possível atualizar" modal="true"
                      responsive="true" width="420" draggable="false" resizable="false">
                <h:outputText value="#{pacienteConsultaBean.mensagemErroEdicao}" styleClass="campo__erro"/>
                <div class="dialogo__acoes">
                    <p:commandButton value="OK" type="button" onclick="PF('erroEdicao').hide();"/>
                </div>
            </p:dialog>
            <p:dialog id="dialogIdade"
                      widgetVar="dialogIdade"
                      header="Idade calculada "
                      modal="true"
                      draggable="false"
                      resizable="false"
                      closeOnEscape="true"
                      responsive="true"
                      width="420">

                <h:outputText value="#{pacienteConsultaBean.resultadoIdade}"/>

                <div class="dialogo__acoes">
                    <p:commandButton value="OK"
                                     type="button"
                                     onclick="PF('dialogIdade').hide();"/>
                </div>
            </p:dialog>
            <p:dialog id="dialogAtualizacaoSucesso"
                      widgetVar="atualizacaoSucesso"
                      header="Atualização concluída"
                      modal="true"
                      closable="false"
                      closeOnEscape="false"
                      draggable="false"
                      resizable="false"
                      responsive="true"
                      width="420">
                <p>Paciente atualizado com sucesso.</p>
                <div class="dialogo__acoes">
                    <h:button value="OK"
                              outcome="/pacientes/listagem"
                              includeViewParams="true"
                              styleClass="botao"/>
                </div>
            </p:dialog>
        </section>
    </ui:define>

</ui:composition>
